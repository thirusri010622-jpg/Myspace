### `.github/workflows/build-apk.yml` கோப்பில் செய்ய வேண்டிய மாற்றம்:

1. `.github/workflows/build-apk.yml` ஃபைலைத் திறந்து Edit செய்யுங்கள்.
2. அதில் உள்ளதை முழுமையாக எடுத்துவிட்டு, கீழேயுள்ள கோடை அப்படியே மாற்றி **Commit changes** கொடுங்கள்:

```yaml
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Create Web Directory
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Setup Capacitor and Android Project
        run: |
          npm init -y
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest
          npx cap init MySanctuary com.sanctuary.app --web-dir www
          npx cap add android
          npx cap sync android

      - name: Accept Android Licenses & Build Debug APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySanctuary-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
