Capacitor-ன் புதிய வெர்ஷன் கம்பைல் செய்ய **Java 21** கேட்கிறது; ஆனால் நாம் ஸ்கிரிப்டில் **Java 17** அமைத்திருந்ததால் Java 17 கம்பைலரால் release 21-ஐ இயக்க முடியாமல் நின்றுவிட்டது[span_1](start_span)[span_1](end_span).

முந்தைய தடவை Android SDK-ல் இருந்த பிழையைச் சரிசெய்துவிட்டோம். இப்போது **Java-வை 21 ஆக மாற்றினால்** இந்த கம்பைலேஷன் பிழை நீங்கி பில்ட் முழுமையடையும்.

